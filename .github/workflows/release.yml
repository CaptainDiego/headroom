name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build DMG
        run: VERSION=${GITHUB_REF_NAME#v} ./build.sh dmg
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Headroom-*.dmg --title "Headroom $GITHUB_REF_NAME" --generate-notes
